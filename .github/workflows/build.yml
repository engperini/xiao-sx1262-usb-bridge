name: Build firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this tag (e.g. v0.1.1); empty = build only"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [xiao_nrf52840]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install adafruit-nrfutil

      - uses: arduino/setup-arduino-cli@v2

      - name: Build
        run: scripts/build.sh ${{ matrix.board }}

      - uses: actions/upload-artifact@v4
        with:
          name: xiao-sx1262-usb-bridge-${{ matrix.board }}
          path: build/*.uf2

      # A pushed v* tag, or a manual run with a release tag (the tag is created on this commit).
      - name: Release tag
        shell: bash
        env:
          INPUT_RELEASE: ${{ github.event.inputs.release }}
        run: |
          tag="$INPUT_RELEASE"
          if [[ -z "$tag" && "$GITHUB_REF" == refs/tags/v* ]]; then tag="${GITHUB_REF#refs/tags/}"; fi
          if [[ -n "$tag" ]]; then
            [[ "$tag" =~ ^v[0-9]+(\.[0-9]+)*([-.][0-9A-Za-z.]+)?$ ]] || { echo "bad release tag: $tag" >&2; exit 1; }
            echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          fi

      - name: Publish release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: build/*.uf2

  host-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint
        run: |
          pip install pyserial pyflakes
          python -m pyflakes tools
          python -m py_compile tools/*.py
